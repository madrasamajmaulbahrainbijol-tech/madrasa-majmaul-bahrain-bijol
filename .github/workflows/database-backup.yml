name: Supabase Database Backup

on:
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate backup secrets
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_DB_URL GitHub secret" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD GitHub secret" && exit 1)
          test -n "$BACKUP_ENCRYPTION_KEY" || (echo "Missing BACKUP_ENCRYPTION_KEY GitHub secret" && exit 1)

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Prepare authenticated database URL
        run: |
          python3 - <<'PY'
          import os
          import re
          from urllib.parse import quote, unquote, urlsplit

          raw = os.environ["SUPABASE_DB_URL"].strip()
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")

          if "://" not in raw:
              # Also accept a bare database host supplied in the secret.
              host = raw.strip().rstrip("/")
              if not host:
                  raise SystemExit("SUPABASE_DB_URL is empty")
              if ":" not in host.rsplit("]", 1)[-1]:
                  host += ":5432"
              username = "postgres.rzsgcrzuhcnxxirglpid"
              authenticated = f"postgresql://{username}:{password}@{host}/postgres"
          else:
              parts = urlsplit(raw)
              if parts.scheme not in ("postgres", "postgresql"):
                  raise SystemExit("SUPABASE_DB_URL must use postgres:// or postgresql://")

              username = parts.username
              host = parts.hostname
              port = parts.port

              if not username or not host:
                  # Fallback parser for connection strings whose authority contains
                  # characters that Python's URL parser cannot interpret normally.
                  match = re.match(r"^(postgres(?:ql)?://)([^/@]+)@([^/]+)(/.*)?$", raw)
                  if match:
                      username = match.group(2).split(":", 1)[0]
                      hostport = match.group(3)
                      path = match.group(4) or "/postgres"
                      authenticated = f"{match.group(1)}{quote(unquote(username), safe='')}:{password}@{hostport}{path}"
                  else:
                      raise SystemExit("SUPABASE_DB_URL must contain a database username and host")
              else:
                  username = quote(unquote(username), safe="")
                  hostport = host + (f":{port}" if port else "")
                  path = parts.path or "/postgres"
                  authenticated = f"{parts.scheme}://{username}:{password}@{hostport}{path}"
                  if parts.query:
                      authenticated += "?" + parts.query

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("SUPABASE_DB_URL_AUTHENTICATED=" + authenticated + "\n")
          PY

      - name: Create database dump
        run: |
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL_AUTHENTICATED" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL_AUTHENTICATED" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL_AUTHENTICATED" -f backup/data.sql --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"

      - name: Create encrypted backup archive
        run: |
          tar -czf supabase-backup.tar.gz -C backup roles.sql schema.sql data.sql
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in supabase-backup.tar.gz \
            -out supabase-backup.tar.gz.enc \
            -pass env:BACKUP_ENCRYPTION_KEY
          rm -rf backup supabase-backup.tar.gz

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: supabase-backup.tar.gz.enc
          retention-days: 90
          if-no-files-found: error
