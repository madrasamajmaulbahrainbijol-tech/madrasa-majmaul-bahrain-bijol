name: Supabase Database Backup

on:
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate backup secrets
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_DB_URL GitHub secret" && exit 1)
          test -n "$BACKUP_ENCRYPTION_KEY" || (echo "Missing BACKUP_ENCRYPTION_KEY GitHub secret" && exit 1)

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Prepare database connection
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit, unquote, quote

          raw = os.environ["SUPABASE_DB_URL"].strip()
          parsed = urlsplit(raw)
          if parsed.scheme not in ("postgres", "postgresql"):
              raise SystemExit("SUPABASE_DB_URL must be a PostgreSQL connection string")
          if not parsed.hostname or not parsed.username:
              raise SystemExit("SUPABASE_DB_URL is missing the database host or username")

          username = quote(unquote(parsed.username), safe="")
          password = unquote(parsed.password or "")
          host = parsed.hostname
          if ":" in host and not host.startswith("["):
              host = f"[{host}]"
          hostport = host + (f":{parsed.port}" if parsed.port else "")
          passwordless = urlunsplit((parsed.scheme, username + "@" + hostport, parsed.path or "/postgres", parsed.query, parsed.fragment))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("SUPABASE_DB_URL_PASSWORDLESS=" + passwordless + "\n")
              f.write("SUPABASE_DB_PASSWORD=" + password + "\n")
          PY

      - name: Create database dump
        run: |
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL_PASSWORDLESS" --password "$SUPABASE_DB_PASSWORD" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL_PASSWORDLESS" --password "$SUPABASE_DB_PASSWORD" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL_PASSWORDLESS" --password "$SUPABASE_DB_PASSWORD" -f backup/data.sql --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"

      - name: Create encrypted backup archive
        run: |
          tar -czf supabase-backup.tar.gz -C backup roles.sql schema.sql data.sql
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in supabase-backup.tar.gz \
            -out supabase-backup.tar.gz.enc \
            -pass env:BACKUP_ENCRYPTION_KEY
          rm -rf backup supabase-backup.tar.gz

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: supabase-backup.tar.gz.enc
          retention-days: 90
          if-no-files-found: error
